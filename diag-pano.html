<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marzipano 诊断</title>
<style>
  body{margin:0;background:#111;color:#fff;font-family:monospace;padding:12px}
  #log{white-space:pre-wrap;font-size:12px;line-height:1.6;margin-bottom:12px}
  #pano{width:100%;height:60vh;background:#000}
  .ok{color:#6f6}.err{color:#f66}.warn{color:#fa0}
</style>
</head>
<body>
<div id="log">[诊断开始]</div>
<div id="pano"></div>
<script src="vendor/marzipano.js"></script>
<script>
const log=document.getElementById('log')
function L(msg,cls='ok'){ log.innerHTML+=`\n<span class="${cls}">${msg}</span>` }

L('Marzipano: ' + typeof Marzipano)
L('UserAgent: ' + navigator.userAgent.substring(0,80))
L('Viewport: ' + innerWidth + 'x' + innerHeight + ' DPR:' + devicePixelRatio)

// 1. 检查图片加载
const img=new Image()
img.onload=()=>L('图片加载完成: ' + img.naturalWidth + 'x' + img.naturalHeight)
img.onerror=(e)=>L('图片加载失败: ' + e, 'err')
img.src='assets/scenes/arena-pano.jpg'

// 2. 检查 WebGL
const c=document.createElement('canvas')
const gl=c.getContext('webgl')||c.getContext('experimental-webgl')
L('WebGL: ' + (gl?'支持':'不支持', gl?'ok':'err'))
if(gl){
  L('MAX_TEXTURE_SIZE: ' + gl.getParameter(gl.MAX_TEXTURE_SIZE))
  L('Renderer: ' + gl.getParameter(gl.RENDERER))
}

// 3. 初始化 Marzipano
try{
  const viewer=new Marzipano.Viewer(document.getElementById('pano'),{controls:{mouseViewMode:'drag'}})
  L('Viewer 创建成功')
  
  const source=Marzipano.ImageUrlSource.fromString('assets/scenes/arena-pano.jpg')
  const geometry=new Marzipano.EquirectGeometry([{width:4096}])
  const limiter=Marzipano.RectilinearView.limit.traditional(4096, 120*Math.PI/180, 176*Math.PI/180)
  const view=new Marzipano.RectilinearView({yaw:0,pitch:0,fov:1.3}, limiter)
  L('View 创建成功, fov=' + view.fov())
  
  const scene=viewer.createScene({source,geometry,view})
  L('Scene 创建成功')
  
  scene.switchTo({transitionDuration:0})
  L('switchTo 完成')
  
  // 4. 检查 canvas
  setTimeout(()=>{
    const canvas=document.querySelector('#pano canvas')
    L('Canvas: ' + (canvas?'存在':'不存在', canvas?'ok':'err'))
    if(canvas){
      L('Canvas尺寸: ' + canvas.width + 'x' + canvas.height + ' CSS:' + canvas.offsetWidth + 'x' + canvas.offsetHeight)
      const gl2=canvas.getContext('webgl')||canvas.getContext('experimental-webgl')
      L('Canvas WebGL: ' + (gl2?'有上下文':'无上下文', gl2?'ok':'err'))
    }
    
    // 5. 检查 stage
    const stage=viewer.stage()
    L('Stage: ' + (stage?'存在':'不存在', stage?'ok':'err'))
    
    // 6. 强制更新尺寸
    viewer.updateSize()
    L('updateSize() 已调用')
    
    // 7. 3秒后检查纹理状态
    setTimeout(()=>{
      L('3秒后检查...')
      const layers=scene.listLayers()
      L('Layers数量: ' + layers.length)
      layers.forEach((l,i)=>{
        L('Layer ' + i + ': texture=' + (l.texture()?'loaded':'null') + ' visible=' + l.visible())
      })
    },3000)
  },500)
  
}catch(e){
  L('初始化异常: ' + e.message, 'err')
  L(e.stack, 'err')
}
</script>
</body>
</html>
