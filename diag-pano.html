<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marzipano 诊断</title>
<style>
  body{margin:0;background:#111;color:#fff;font-family:monospace;padding:12px}
  #log{white-space:pre-wrap;font-size:12px;line-height:1.6;margin-bottom:12px;max-height:50vh;overflow-y:auto}
  #pano{width:100%;height:40vh;background:#000}
  #imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  #imgs img{width:80px;height:40px;object-fit:cover;border:1px solid #444}
  .ok{color:#6f6}.err{color:#f66}.warn{color:#fa0}
</style>
</head>
<body>
<div id="log">[诊断开始]</div>
<div id="imgs"></div>
<div id="pano"></div>
<script src="vendor/marzipano.js"></script>
<script>
const log=document.getElementById('log')
const imgsDiv=document.getElementById('imgs')
function L(msg,cls='ok'){ log.innerHTML+=`\n<span class="${cls}">${msg}</span>`; log.scrollTop=log.scrollHeight }

L('UA: ' + navigator.userAgent.substring(0,70))
L('Viewport: ' + innerWidth + 'x' + innerHeight + ' DPR:' + devicePixelRatio)

// 测试 4 张图：小测试图 + 全景图，JPG + WebP + PNG
const tests = [
  { name: 'test-red.jpg', url: 'assets/scenes/test-red.jpg' },
  { name: 'test-red.webp', url: 'assets/scenes/test-red.webp' },
  { name: 'test-red.png', url: 'assets/scenes/test-red.png' },
  { name: 'arena-pano.jpg', url: 'assets/scenes/arena-pano.jpg' },
]

let loaded = 0
tests.forEach(t=>{
  const img = new Image()
  img.onload = ()=>{
    L(`✓ ${t.name}: ${img.naturalWidth}x${img.naturalHeight}`)
    const thumb = document.createElement('img')
    thumb.src = t.url
    thumb.title = t.name
    imgsDiv.appendChild(thumb)
    loaded++
    if(loaded === tests.length) startMarzipano()
  }
  img.onerror = (e)=>{
    L(`✗ ${t.name}: 加载失败`, 'err')
    loaded++
    if(loaded === tests.length) startMarzipano()
  }
  img.src = t.url
})

function startMarzipano(){
  L('--- 开始 Marzipano ---')
  
  // 优先用 WebP，失败回退 JPG
  const tryUrls = ['assets/scenes/arena-pano.webp', 'assets/scenes/arena-pano.jpg']
  let idx = 0
  
  function tryNext(){
    if(idx >= tryUrls.length){
      L('所有格式都失败', 'err')
      return
    }
    const url = tryUrls[idx]
    L('尝试: ' + url)
    
    try{
      const viewer = new Marzipano.Viewer(document.getElementById('pano'), {controls:{mouseViewMode:'drag'}})
      const source = Marzipano.ImageUrlSource.fromString(url)
      const geometry = new Marzipano.EquirectGeometry([{width:2048}])
      const limiter = Marzipano.RectilinearView.limit.traditional(2048, 120*Math.PI/180, 176*Math.PI/180)
      const view = new Marzipano.RectilinearView({yaw:0,pitch:0,fov:1.3}, limiter)
      const scene = viewer.createScene({source, geometry, view})
      
      // 监听纹理加载
      const layer = scene.listLayers()[0]
      let textureLoaded = false
      
      const checkTimer = setInterval(()=>{
        const tex = layer.texture()
        if(tex && !textureLoaded){
          textureLoaded = true
          clearInterval(checkTimer)
          L('纹理加载成功: ' + url)
          scene.switchTo({transitionDuration:0})
          L('switchTo 完成')
        }
      }, 100)
      
      // 5秒超时
      setTimeout(()=>{
        if(!textureLoaded){
          clearInterval(checkTimer)
          L('纹理加载超时: ' + url, 'err')
          viewer.destroy()
          idx++
          tryNext()
        }
      }, 5000)
      
    }catch(e){
      L('异常: ' + e.message, 'err')
      idx++
      tryNext()
    }
  }
  
  tryNext()
}
</script>
</body>
</html>
